
services:
  ymlas:
    image: ymlas:v2
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5001"
    networks:
      - ymlas-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ymlas
    networks:
      - ymlas-network

networks:
  ymlas-network:
    driver: bridge
