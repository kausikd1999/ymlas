<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        YMLAS
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="sidebar">

    <div class="logo-section">

        <h1 class="logo">YMLAS</h1>

        <p class="tagline">
            Monitoring Platform
        </p>

    </div>

    <div class="menu">

        <a href="/dashboard" class="menu-item {% if request.path == '/dashboard' %}active{% endif %}">
            📊 Dashboard
        </a>

        <a href="/logs" class="menu-item {% if request.path == '/logs' %}active{% endif %}">
            📜 Logs
        </a>

        <a href="/alerts" class="menu-item {% if request.path == '/alerts' %}active{% endif %}">
            🚨 Alerts
        </a>

        <a href="/deployments" class="menu-item {% if request.path == '/deployments' %}active{% endif %}">
            🚀 Deployments
        </a>

        <a href="/servers" class="menu-item {% if request.path == '/servers' %}active{% endif %}">
            🖥️ Servers
        </a>

        <a href="/settings" class="menu-item {% if request.path == '/settings' %}active{% endif %}">
            ⚙️ Settings
        </a>

    </div>

    <div class="sidebar-footer">

        <div class="status-box">

            <span class="status-dot"></span>

            System Healthy

        </div>

        <div class="version">

            YMLAS v0.2

        </div>

    </div>

</div>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

{% block scripts %}
{% endblock %}

</body>

</html>
