name: YMLAS CI

on:
  push:
    branches:
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile app.py

      - name: Verify Flask Imports
        run: |
          python -c "from app import app; print('Flask app loaded successfully')"

      - name: Install and Run Linter
        run: |
          pip install flake8
          python -m flake8 .

      - name: Run Unit Tests
        run: |
          pip install pytest
          python -m pytest .

      - name: HTML Validation
        continue-on-error: true
        run: |
          pip install html5validator
          html5validator --root templates

      - name: Eslint Validation
        continue-on-error: true
        run: |
          npm install -g eslint
          eslint static/js

      - name: Stylelint Validation
        continue-on-error: true
        run: |
          npm install -g stylelint
          stylelint "static/css/**/*.css"

      - name: Flask Smoke Test
        run: |
          python -m pytest tests/test_app.py -v

      - name: Check for Security Vulnerabilities
        continue-on-error: true
        run: |
          pip install bandit
          python -m bandit -r .

      - name: pip-audit Validation
        continue-on-error: true
        run: |
          pip install pip-audit
          python -m pip_audit

      - name: CI Passed
        run: |
          echo "YMLAS validation completed successfully"

  docker:

    needs: validate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ymlas-app:${{ github.sha }} .

      - name: Run Docker Container
        run: |
          docker run -d --name ymlas-container -p 5001:5001 ymlas-app:${{ github.sha }}

      - name: Wait for Container to Start
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5001/health; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 5
          done
          echo "Container failed to start in time"
          exit 1

      - name: Show Container Logs
        if: failure()
        run: |
          docker logs ymlas-container

      - name: Cleanup Docker Container
        if: always()
        run: |
          docker stop ymlas-container || true
          docker rm ymlas-container || true

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ymlas-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Image for Docker Hub
        run: |
          docker tag ymlas-app:${{ github.sha }} kausikdas1999/ymlas:${{ github.sha }}

      - name: Push Image to Docker Hub
        run: |
          docker push kausikdas1999/ymlas:${{ github.sha }}



  deploy:
    name: Deploy to AWS EC2
    needs: [validate, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy YMLAS to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.EC2_DEPLOY_PATH }}"
            sed -i 's|image: kausikdas1999/ymlas:.*|image: kausikdas1999/ymlas:${{ github.sha }}|' compose.yaml
            sudo docker compose pull ymlas
            sudo docker compose up -d ymlas
            sudo docker compose ps
